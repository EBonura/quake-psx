# Quake's test description for psoxide-test (the SDK's harness, tools/psoxide-test).
# It declares what to build and check; the harness decides how. Baseline: psoxide-test.baseline.toml.
#
# Quake's build driver (host/quake-build) refuses a shipping build whose environment holds
# CARGO_BUILD_* (and RUSTFLAGS, a RUSTC_WRAPPER other than sccache, and others), and the harness
# sets CARGO_BUILD_JOBS, so every driver command lists it in env_remove. The driver has no job
# setting: its guest build runs at cargo's default.
schema = 1
name = "Quake"
repository = "EBonura/quake-psx"

# The shipping disc (dist/) and its link map. `ship-boot` rebuilds the release configuration with
# a link map and boots it on the frontend (the old `ram` check: the heap cursor lies inside the
# linked heap after a headless boot); size and free RAM are read from that map.
[[build]]
name = "ship"
out = "build/ship"
env_remove = ["CARGO_BUILD_JOBS"]
env = { QUAKE_PSX_FRONTEND = "{tool:frontend}" }
commands = [
  ["cargo", "run", "--locked", "--manifest-path", "psoxide-pin/Cargo.toml"],
  ["cargo", "run", "--locked", "--release", "--manifest-path", "host/quake-build/Cargo.toml", "--", "build"],
  ["cargo", "run", "--locked", "--release", "--manifest-path", "host/quake-build/Cargo.toml", "--", "ship-boot"],
]
collect = { "quake-psx.bin" = "dist/quake-psx.bin", "quake-psx.cue" = "dist/quake-psx.cue", "quake-psx.exe" = "dist/quake-psx.exe", "link.map" = "build-psoxide-ship-boot/quake-psx.map" }
disc = "quake-psx.cue"
map = "link.map"

# The journey disc: the game at the fixed 30 Hz step plus the read-only state block
# (JOURNEY_STATE). The chain journey and the cross-emulator smoke play it.
[[build]]
name = "journey"
out = "build/journey"
env_remove = ["CARGO_BUILD_JOBS"]
commands = [
  ["cargo", "run", "--locked", "--release", "--manifest-path", "host/quake-build/Cargo.toml", "--", "journey-build"],
]
collect = { "quake-psx.bin" = "build-psoxide-journey/quake-psx.bin", "quake-psx.cue" = "build-psoxide-journey/quake-psx.cue", "quake-psx.exe" = "build-psoxide-journey/quake-psx.exe", "quake-psx.map" = "build-psoxide-journey/quake-psx.map" }
disc = "quake-psx.cue"
map = "quake-psx.map"

[[size]]
build = "ship"

# The Start hall walk of the recorded chain, on the journey disc (fixed 30 Hz step) with the chain's first
# tape (182 polls from boot: menu, new game, the walk toward the slipgate). The window runs from the
# game's published frame 90 (the player is walking the hall) to frame 135, so that the eight offsets (-48 to +36 polls) all
# stay inside the 182-poll tape: the replay stops at the tape's end, before the E1M1 load, so the load cannot bound it.
[[speed]]
name = "start-hall-walk"
build = "journey"
tape = "tests/journeys/e1-chain/tapes/seg-00-to-e1m1.pxtape"
from = { kind = "ram", sym = "JOURNEY_STATE", offset = 12, size = 4, op = "ge", value = 90 }
until = { kind = "ram", sym = "JOURNEY_STATE", offset = 12, size = 4, op = "ge", value = 135 }
max_polls = 200
offsets = [-48, -36, -24, -12, 0, 12, 24, 36]

[journeys]
files = "tests/*.toml"
precheck = ["smoke-boot-play"]

[cross]
smoke = ["tests/smoke-boot-play.toml"]

# Every host check is keyed on what quake-build reads (`inputs`, `uses`): the game, its crates
# and data, the driver itself (which names the SDK revision, so a pin move runs them again), the
# hydrated SDK's guest sources and the frontend. A journey, test or doc edit does not run them.

# The old `ram` check, kept as a number: free heap after the shipping boot (the driver's own floor
# is 8192).
[[host]]
name = "heap-free"
exclusive = "quake-target"
inputs = ["game/", "crates/", "host/", "id1psx/", "assets/", "tools/", "release/", "psoxide-pin/", ".cargo/", "Cargo.toml", "Cargo.lock", "components.lock.json", "rust-toolchain.toml", "psx-gate.toml"]
uses = ["sdk", "frontend"]
env_remove = ["CARGO_BUILD_JOBS"]
env = { QUAKE_PSX_FRONTEND = "{tool:frontend}" }
command = ["cargo", "run", "--locked", "--release", "--manifest-path", "host/quake-build/Cargo.toml", "--", "ship-boot"]
metric = { key = "heap_free", better = "higher", min = 8192 }

[[host]]
name = "map-regress"
exclusive = "quake-target"
inputs = ["game/", "crates/", "host/", "id1psx/", "assets/", "tools/", "release/", "psoxide-pin/", ".cargo/", "Cargo.toml", "Cargo.lock", "components.lock.json", "rust-toolchain.toml", "psx-gate.toml"]
uses = ["sdk", "frontend"]
env_remove = ["CARGO_BUILD_JOBS"]
env = { QUAKE_PSX_FRONTEND = "{tool:frontend}" }
models = ["real", "mister", "mister,gpu-irq=never"]
command = ["cargo", "run", "--locked", "--release", "--manifest-path", "host/quake-build/Cargo.toml", "--", "map-regress"]

