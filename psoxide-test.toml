# Quake's test description for psoxide-test (the SDK's harness, tools/psoxide-test).
# It declares what to build and check; the harness decides how. Baseline: psoxide-test.baseline.toml.
#
# Quake build driver (host/quake-build) refuses a shipping build that sees CARGO_BUILD_* and other
# output-affecting variables (only the sccache RUSTC_WRAPPER is allowed), and the harness always sets CARGO_BUILD_JOBS, so every driver command is run
# through `env -u CARGO_BUILD_JOBS` (harness-core/REQUESTS.md: "a build declares the environment it must not see").
# The older regression commands need QUAKE_PSX_FRONTEND (the PSoXide frontend) in the environment
# the harness is started from (REQUESTS.md: a `{tool:frontend}` placeholder in env).
schema = 1
name = "Quake"
repository = "EBonura/quake-psx"

# The shipping disc (dist/) and its link map. `ship-boot` rebuilds the release configuration with
# a link map and boots it on the frontend: it is the old `ram` check (heap cursor inside the
# linked heap after a headless boot), and it is where size and free RAM are read.
[[build]]
name = "ship"
out = "build/ship"
commands = [
  ["cargo", "run", "--locked", "--manifest-path", "psoxide-pin/Cargo.toml"],
  ["env", "-u", "CARGO_BUILD_JOBS", "cargo", "run", "--locked", "--release", "--manifest-path", "host/quake-build/Cargo.toml", "--", "build"],
  ["env", "-u", "CARGO_BUILD_JOBS", "cargo", "run", "--locked", "--release", "--manifest-path", "host/quake-build/Cargo.toml", "--", "ship-boot"],
]
collect = { "quake-psx.bin" = "dist/quake-psx.bin", "quake-psx.cue" = "dist/quake-psx.cue", "quake-psx.exe" = "dist/quake-psx.exe", "link.map" = "build-psoxide-ship-boot/quake-psx.map" }
disc = "quake-psx.cue"
map = "link.map"

# The journey disc: the game at the fixed 30 Hz step plus the read-only state block
# (JOURNEY_STATE). The chain journey and the cross-emulator smoke play it.
[[build]]
name = "journey"
out = "build/journey"
commands = [
  ["env", "-u", "CARGO_BUILD_JOBS", "cargo", "run", "--locked", "--release", "--manifest-path", "host/quake-build/Cargo.toml", "--", "journey-build"],
]
collect = { "quake-psx.bin" = "build-psoxide-journey/quake-psx.bin", "quake-psx.cue" = "build-psoxide-journey/quake-psx.cue", "quake-psx.exe" = "build-psoxide-journey/quake-psx.exe", "quake-psx.map" = "build-psoxide-journey/quake-psx.map" }
disc = "quake-psx.cue"
map = "quake-psx.map"

[size]
build = "ship"

[journeys]
files = "tests/journeys/*.toml"
precheck = ["smoke-boot-play"]

[cross]
smoke = ["tests/journeys/smoke-boot-play.toml"]

