command = ["cargo", "run", "--locked", "--release", "--manifest-path", "host/quake-build/Cargo.toml", "--", "e1m1-chain-bench"]
# The route's elapsed bus cycles. The tolerance is the layout noise measured on this bench (0.45
# percent of 1.93e9, quake-w2 notes): a relink of identical code moves it that much.
metric = { key = "full_level_elapsed_bus_cycles", better = "lower", tolerance = 8700000, reason = "measured link-layout noise of this bench, 0.45 percent" }

