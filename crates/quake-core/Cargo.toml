[package]
name = "quake-core"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
description = "Platform-independent Rust simulation primitives for Quake PSX"

[lib]
path = "src/lib.rs"

[features]
# Measurement knobs: start the presentation options on id's stepped behaviour
# instead of the smooth defaults, so a bench or a regression can pin either.
classic-lights = []
classic-poses = []
# Blend and glide monster and weapon poses between the 0.1 s sim steps, and
# show the POSES row. Off in the shipping image: it does not fit the heap floor.
smooth-poses = []

[dependencies]
quake-formats = { path = "../quake-formats" }
# Hydrated from the repository-level PSoXide pin. Until convergence commit
# d4458c46d1600c5621168d5027cac2afce9fef61 is pushed, build with the explicit
# `--psoxide /path/to/that/checkout` development override.
psx-bsp = { path = "../../.psoxide/engine/crates/psx-bsp" }
psx-engine = { path = "../../.psoxide/engine/crates/psx-engine" }
psx-math = { path = "../../.psoxide/sdk/crates/psx-math" }
psx-gte = { path = "../../.psoxide/sdk/crates/psx-gte" }

[dev-dependencies]
psx-gpu = { path = "../../.psoxide/sdk/crates/psx-gpu" }
