[package]
name = "quake-psx-build"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
description = "End-to-end shareware demo builder and PSoXide regression runner for quake-psx"
default-run = "quake-psx-build"

# Standalone host workspace. The repository root is the PS1 game's workspace,
# which only the guest and its path dependencies belong to, and whose release
# profile is the guest's. From the repository root: `cargo quake-build ...`
# (an alias in .cargo/config.toml).
[workspace]

[[bin]]
name = "quake-psx-build"
path = "main.rs"

[[bin]]
name = "quake2-transfer-census"
path = "../../tools/quake2-transfer-census.rs"

[[bin]]
name = "fixed-quad-tessellation-census"
path = "../../tools/fixed-quad-tessellation-census.rs"

[[bin]]
name = "portal-census"
path = "../../tools/portal-census.rs"

[[bin]]
name = "face-merge-census"
path = "../../tools/face-merge-census.rs"

# Host tests of guest modules, compiled from game/src through #[path].
[[test]]
name = "forward_chunk_reader"
path = "../../tests/forward_chunk_reader.rs"

[[test]]
name = "input_policy"
path = "../../tests/input_policy.rs"

[[test]]
name = "pusher_atomicity"
path = "../../tests/pusher_atomicity.rs"

[dependencies]
# The hydration helper and the guest SDK resolve from the same published
# revision. The build verifies this lockfile source before copying any SDK
# inputs into the content-addressed guest stage.
psoxide-link = { git = "https://github.com/EBonura/PSoXide.git", rev = "810f917623ed98bc8bbe069504b3b4e71c1757d9" }
quake-cook = { path = "../../crates/quake-cook" }
quake-core = { path = "../../crates/quake-core" }
quake-formats = { path = "../../crates/quake-formats" }
sha2 = "0.10"

serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
