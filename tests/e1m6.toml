# Generated by quake-journey-bot; replays the recorded pad tapes and checks the exact state at each map change.
name = "quake-e1m6"
title = "Quake Episode 1: title to the last recorded map, one pad tape per map (quake-e1m6)"
disc = ["build/journey/quake-psx.cue"]
symbols = ["build/journey/quake-psx.map"]
pad = "dualshock"
card_fixture = { path = "tests/journeys/e1m6/start.mcd", sha256 = "bfee19e9c479a134efc778c5a6613e63b664f6d2fe44364b08ac2036e154edfe" }
