# Controller input only, no state is written.
name = "quake-e1m1-exit"
title = "Quake: title, START, E1M1 with live enemies to the authored exit"
disc = ["build-psoxide-e1m1-normal-journey/quake-psx.cue"]
symbols = ["build-psoxide-e1m1-normal-journey/quake-psx.map"]
pad = "analog"
card_observe = true
max_ticks = 9000

# Bound to the build this journey was written against: quake_psx::e1m1_chain_regression::PROBE
[addr]
E1M1_PROBE = 0x8008c24c

[[step]]
label = "boot to the title"
wait = 900

[[step]]
label = "title: New Game"
press = ["cross"]
hold = 4
wait = 60

[[step]]
label = "START skill door, slipgate, E1M1 live enemies, authored exit, E1M2 loaded"
wait_until = { kind = "ram", sym = "E1M1_PROBE", offset = 8, size = 4, op = "eq", value = 1 }
timeout = 8000

[[step]]
checkpoint = "e1m1-exit-e1m2-loading"
golden = false
[[step.assert]]
kind = "not_flat"
[[step.assert]]
kind = "card_unchanged"

[[step.assert]]
kind = "ram"
sym = "E1M1_PROBE"
offset = 0
size = 4
op = "eq"
value = 1364218712

[[step.assert]]
kind = "ram"
sym = "E1M1_PROBE"
offset = 16
size = 4
op = "eq"
value = 0

[[step.assert]]
kind = "ram"
sym = "E1M1_PROBE"
offset = 88
size = 4
op = "eq"
value = 2

[[step.assert]]
kind = "ram"
sym = "E1M1_PROBE"
offset = 124
size = 4
op = "eq"
value = 32767

[[step.assert]]
kind = "ram"
sym = "E1M1_PROBE"
offset = 92
size = 4
op = "eq"
value = 60

[[step.assert]]
kind = "ram"
sym = "E1M1_PROBE"
offset = 116
size = 4
op = "between"
value = 1
value_hi = 200

