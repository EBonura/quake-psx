# Generated by quake-journey-bot; replays the recorded pad tapes and checks the exact state at each map change.
name = "quake-e1m4-secret"
title = "Quake Episode 1: title to the last recorded map, one pad tape per map (quake-e1m4-secret)"
disc = ["build/journey/quake-psx.cue"]
symbols = ["build/journey/quake-psx.map"]
pad = "dualshock"
card_fixture = { path = "tests/journeys/e1m4-secret/start.mcd", sha256 = "30c48d8df5e3b944a5585b4b8520dbbc22c330e935634f27b3b4414ed2ac3dfe" }
max_ticks = 400000

[[step]]
label = "the game published its first frame"
sync = "poll"
timeout = 4000
[step.wait_until]
kind = "ram"
sym = "JOURNEY_STATE"
offset = 8
size = 4
op = "nonzero"

