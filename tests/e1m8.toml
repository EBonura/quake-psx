# Generated by quake-journey-bot; replays the recorded pad tapes and checks the exact state at each map change.
name = "quake-e1m8"
title = "Quake Episode 1: title to the last recorded map, one pad tape per map (quake-e1m8)"
disc = ["build/journey/quake-psx.cue"]
symbols = ["build/journey/quake-psx.map"]
pad = "dualshock"
card_fixture = { path = "tests/journeys/e1m8/start.mcd", sha256 = "538d4686e726e3bbcea1b5c52dac09814a69fdaac4364b2f0b59c8f42977de8d" }
