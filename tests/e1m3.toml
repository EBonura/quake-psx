# Generated by quake-journey-bot; replays the recorded pad tapes and checks the exact state at each map change.
name = "quake-e1m3"
title = "Quake Episode 1: title to the last recorded map, one pad tape per map (quake-e1m3)"
disc = ["build/journey/quake-psx.cue"]
symbols = ["build/journey/quake-psx.map"]
pad = "dualshock"
card_fixture = { path = "tests/journeys/e1m3/start.mcd", sha256 = "7ce9deae9898194f3c4157a3baffd35419c154d1d47854930ca0b75e0e72b742" }
max_ticks = 400000

[[step]]
label = "the game published its first frame"
sync = "poll"
timeout = 4000
[step.wait_until]
kind = "ram"
sym = "JOURNEY_STATE"
offset = 8
size = 4
op = "nonzero"

