pad = "dualshock"
card_fixture = { path = "tests/journeys/e1m2/start.mcd", sha256 = "3070eeced5fbfa4a03777fc00a5df38adb623bb23ff9a86a906159c5fe75430d" }
max_ticks = 400000

[[step]]
label = "the game published its first frame"
sync = "poll"
timeout = 4000
[step.wait_until]
kind = "ram"
sym = "JOURNEY_STATE"
offset = 8
size = 4
op = "nonzero"

