# Generated by quake-journey-bot; replays the recorded pad tapes and checks the exact state at each map change.
name = "quake-e1m5"
title = "Quake Episode 1: title to the last recorded map, one pad tape per map (quake-e1m5)"
disc = ["build/journey/quake-psx.cue"]
symbols = ["build/journey/quake-psx.map"]
pad = "dualshock"
card_fixture = { path = "tests/journeys/e1m5/start.mcd", sha256 = "3d86a76628e123c1e376ab6dfec17181578fd06114ca0ce57564d9e33eb21b19" }
