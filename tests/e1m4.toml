# Generated by quake-journey-bot; replays the recorded pad tapes and checks the exact state at each map change.
name = "quake-e1m4"
title = "Quake Episode 1: title to the last recorded map, one pad tape per map (quake-e1m4)"
disc = ["build/journey/quake-psx.cue"]
symbols = ["build/journey/quake-psx.map"]
pad = "dualshock"
card_fixture = { path = "tests/journeys/e1m4/start.mcd", sha256 = "42ae49d7b6ba7860a32abf91efb445c4f20629fdc42e62500d6894b0a107e95e" }
max_ticks = 400000

[[step]]
label = "the game published its first frame"
sync = "poll"
timeout = 4000
[step.wait_until]
kind = "ram"
sym = "JOURNEY_STATE"
offset = 8
size = 4
op = "nonzero"

